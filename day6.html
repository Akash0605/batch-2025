<!DOCTYPE html>
<html>

<head>
    <title>Text Box</title>
</head>

<body>
    <div style="border: 3px dotted black; padding: 30px;">
        <fieldset>
            <legend style="text-align: center; color: red; background-color: yellow;">Registration Form</legend>
            <form action="" method="">
                <label for="firstName" />
                    First Name: <input type="text" id="firstName" name="first-name" placeholder="Enter First Name" value=""
                    maxlength="10" required />
                
                Amount: <input type="number" required />
                <label for="lang">
                    Language: Hindi<input id="lang" type="checkbox" name="lang" /></label>
                    Time: <input type="time" value="12:12" name="time" />
                    Month: <input type="month" value="" name="month" />
                    Password: <input type="password" name="pass" />
                    Date Time: <input type="datetime-local" name="all" />
                    Search: <input type=" search" />
                    Choose Color: <input type="color" />
                    Enter URL: <input type="url" title="URL" />
                    
    
    
                <input type="submit" value="Submit" title="Click Here" />
            </form>
        </fieldset>
    </div>
</body>

</html>
