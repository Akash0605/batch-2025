        document.write("<br>(a + b) = ",a+b);
        document.write("<br>(a - b) = ",a-b);
        document.write("<br>(a * b) = ",a*b);
        document.write("<br>(a / b) = ",a/b);
        document.write("<br>(a % b) = ",a%b);

        document.write("<br>==== Assignment Operators ====");
        document.write("<br>z = ",10);
        document.write("<br>d += 5 = ",d += 5);
        document.write("<br>d -= 5 = ",d -= 5);
        document.write("<br> Add 5 to d = ",d+5);
        document.write("<br> After add 5 into d = ",d);
        document.write("<br>d *= 5 = ",d *= 5);
        document.write("<br>d /= 5 = ",d /= 5);
        document.write("<br>d %= 5 = ",d %= 5);
        document.write("<br>d = ",d);
        document.write("<br>d++ = ",d++);
        document.write("<br>d-- = ",d--);
        document.write("<br>--d = ",--d);
        document.write("<br>++d = ",++d);
        document.write("<br>++d + 5 + d++ = ",++d + 5 + d++);

        document.write("<br>==== Comparison Operators ====");
        document.write("<br>(a == b) = ",a == b);
        document.write("<br>(a != b) = ",a != b);
        document.write("<br>(a > b) = ",a > b);
        document.write("<br>(a < b) = ",a < b);
        document.write("<br>(a >= b) = ",a >= b); // Greater than or equal to
        document.write("<br>(a <= b) = ",a <= b);
        document.write("<br>(a === b) = ",a === b);
        document.write("<br>(a === c) = ",a === c);
        document.write("<br>(a !== b) = ",a !== b);
        document.write("<br>(a !== c) = ",a !== c);

        document.write("<br>==== Logical Operators ====");
        document.write("<br>(a > 5 && b > 15) = ",(a > 5 && b > 15));
        document.write("<br>(a > 15 || b > 15) = ",(a > 15 || b > 15));
        document.write("<br>(!(a < 5)) = ",!(a < 5));

        document.write("<br>Addition of a and b is : ",a+b);

        document.write("<br>==== Turnary Operator or Conditional Operator ====");
        document.write("<br>(a > b) ? ",(a > b) ? a : b);
        document.write("<br>(a < b) ? ",(a < b) ? ("a = ",a) : ("b = ",b));
        document.write("<br>None zero value: 5 ? ", 5 ? ("a = ",a) : ("b = ",b));

        document.write("<br />a = ",a);
        document.write("<br />b = ",b);
        document.write("<br />c = ",c);
        document.write("<br />d = ",d);
        document.write("<br />e = ",e);
        document.write("<br />f = ",f);
        console.log(a);
        console.log(b);

        console.log(add(5,8));

        function add(x,y){
            console.log("Local variable : ", x,a)
            return x+y;
        }

        console.log("Local variable : ", x,y)
    </script>
    <script>
        var abc = 10 // Global variable
        if(1){
            let xyz = 20; // Local variable
            console.log("Inside if block : ",xyz);  // Local variable can be accessed inside if block
            console.log("Inside if block : ",abc);  // Global variable can be accessed inside if block
        }
        console.log(abc) // Global variable can be accessed outside if block
        console.log(xyz) // Local variable cannot be accessed outside if block
    </script>
