<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destructuring Assignement</title>
</head>
<body>
    <h1>Destructuring Assignment</h1>

    <script>
        let [a, b] = [10, 20];
        let [c, d] = [30];
        console.log(a)
        console.log(b)
        console.log(a,b)
        console.log(a, b)
        console.log(c)
        console.log(c, d) // d = undefined

        // Spread Operator
        let arr = [1, 2, 3]
        let arr1 = [...arr, 4, 5]
        for(let i = 0; i < arr.length; i++){
            console.log(arr[i])
        }
        console.log("After spread operator used-")
        for(let i = 0; i < arr1.length; i++){
            console.log(arr1[i])
        }

        // Rest Operator
        function restTest(...arr){
            console.log(arr)
        }
        restTest(1,2,3,4,5,6,6,77,8,8,9)
    </script>

    <script type="module">
        
        // Import Statement
        import great from "./demo.js";
        great()
    </script>
</body>
</html>
