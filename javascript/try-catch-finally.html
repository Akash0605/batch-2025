<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try - catch and finaly</title>
</head>
<body>
    <h1>Try - catch and finally</h1>

    <script>
        try{
            let x = 10;
            let y = 0;
            let z = x / y; // This will throw an error (division by zero)
            console.log(z);
        } catch (error) {
            console.error("An error occurred: " + error.message);
        } finally {
            console.log("This block will always execute.");
        }
