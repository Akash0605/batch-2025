<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitwise Operators</title>
</head>
<body>
    <script>
        var a = 2;
        var b = 3;
        var c = 5;
        var d = 1;
        var sfsfd = a - b * c;
        console.log("🚀 ~ sfsfd:", sfsfd)
        console.log("🚀 ~ sfsfd:", sfsfd)
        console.log("🚀 ~ sfsfd:", sfsfd)
        console.log("🚀 ~ sfsfd:", sfsfd)
        console.log("🚀 ~ sfsfd:", sfsfd)
        document.write("==== Bitwise Operator ====")
        document.write("<br>a = ", a);
        document.write("<br>b = ", b);
        document.write("<br>c = ", c);
        document.write("<br>(a & b) = ", a & b);
        document.write("<br>(a | b) = ", a | b);
        document.write("<br>(~b) = ", ~b);
        document.write("<br>(~c) = ", ~c);
        document.write("<br>(a ^ b) = ", a ^ b);
        document.write("<br>Leftshift (a<<d) = ", (a << d));
    </script>
</body>
</html>
