<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .papa {
            height: 500px;
            width: 500px;
            border: 1px solid;
            border-radius: 50%;
            background-color: aliceblue;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .WATCH {
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 50%;
            width: 450px;
        }
    </style>
</head>

<body>
    <div class="papa">
        <div class="WATCH">
            <span>9</span>
            <span>3</span>
        </div>
        <div class="WATCH" style="rotate: 90deg;">
            <span style="rotate: -90deg;">12</span>
            <span style="rotate: -90deg;">6</span>
        </div>
        <div class="WATCH" style="rotate: 120deg;">
            <span style="rotate: -120deg;">1</span>
            <span style="rotate: -120deg;">7</span>
        </div>
        <div class="WATCH" style="rotate: 150deg;">
            <span style="rotate: -150deg;">2</span>
            <span style="rotate: -150deg;">8</span>
        </div>
        <div class="WATCH" style="rotate:210deg;">
            <span style="rotate: -210deg;">4</span>
            <span style="rotate: -210deg;">10</span>
        </div>
        <div class="WATCH" style="rotate: 240deg;">
            <span style="rotate: -240deg;">5</span>
            <span style="rotate: -240deg;">11</span>
        </div>
        <div class="WATCH" style="rotate: 240deg; width: 380px; align-items: center; justify-content: center;">
            <span style="width: 300px; height: 2px; background-color: black; opacity: 0;"></span>
            <span style="width: 350px; height: 1px; background-color: red;"></span>
        </div>
        <div class="WATCH" style="rotate: 200deg; width: 380px; align-items: center; justify-content: center;">
            <span style="width: 350px; height: 2px; background-color: black; "></span>
            <span style="width: 350px; height: 1px; background-color: red; opacity: 0;"></span>
        </div>
        <div class="WATCH"
            style=" justify-content: center; height: 10px; width: 10px; border: 1px solid;border-radius: 50%; align-items: center; position: relative;background-color: black;">
        </div>

    </div>
</body>

</html>
