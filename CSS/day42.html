<!DOCTYPE html>
<html>
    <head>
        <title>Transform</title>
        <style>
            .main {
                display: flex;
                gap: 25px;
            }
            .parent {
                width: 300px;
                height: 200px;
                background-color: brown;
                border: 5px solid blue;
                border-bottom-width: 30px;
                margin: 100px 0 0 100px;
                transform: scale(2);    /* apply same value for axis like x-axis and y-axis */
                transform: scale(2,5);  /* apply different value for axis like x-axis and y-axis */
                transform: scaleX(2);  /* apply only x-axis */
                transform: scaleY(-5);  /* apply only y-axis */
                
                transform: rotate(-20deg);  /* apply same value for both axis */

                transform: rotateX(45deg) rotateY(40deg) rotateZ(60deg);

                transform: skew(-30deg);
                
                
                
            }

            .parent1 {
                width: 300px;
                height: 200px;
                background-color: brown;
                border: 5px solid blue;
                border-bottom-width: 30px;
                margin: 100px 0 0 100px;
                transform: skew(30deg);
                
            }
            button{
                margin-top: 20px;
            }

            .next {
                width: 600px;
                /* height: 200px; */
                border: 5px solid blue;
                margin: 0 0 0 100px;
            }

        </style>
    </head>
    <body onmousemove="myReload();">
        <div class="main">
            <div class="parent scale">
                viaks akash inshant  welcome
            </div>
            <div class="parent1 scale">
                viaks akash inshant  welcome
            </div>
        </div>
        <div class="next"></div>
        <button onclick="myReload();">Reload</button>

        <script>
            function myReload(){
                location.reload();
            }
        </script>
    </body>
</html>
