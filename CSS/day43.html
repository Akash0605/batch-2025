<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .main{
            width: 400px;
            height: 300px;
            background: url('../nature.webp');
            animation: move;
            animation-duration: 10s;
        }

        @keyframes move {
            from{
                background-color: green;
                border-radius: 0%;
                width: 10px;
                height: 10px;
            }
            
            25%{
                width: 200px;
                height: 200px;
                
            }
            
            50%{
                width: 10px;
                height: 10px;

            }
            
            75%{
                width: 200px;
                height: 200px;

            }

            to{
                background-color: blue;
                border-radius: 50%;
                width: 500px;
                height: 500px;
                margin-left: calc(100% - 500px);
            }
        }

        .second {
            animation-name: spin;
            /* animation-delay: -1s;
            animation-duration: -2s; */
            animation-iteration-count: infinite;

        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="main">
         
    </div>
    <div class="main second">
         
    </div>

    <button title="Click to move" onclick="myReload()">Move</button>


    <script>
        function myReload(){
            location.reload();
        }
    </script>
</body>
</html>
