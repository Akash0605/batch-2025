<!DOCTYPE html>
<html>
    <head>
        <title>Positions and Layers</title>
        <style>
            div {
                width: 400px;
                height: 200px;
                border: 2px solid red;
                background-color: aqua;
            }

            .first {
                position: relative;
                left: 80px;
                top: -40px;
                width: 400px;
                height: 400px;
                border-radius: 50%;
                background-color: rgba(237, 154, 154, 0.729);
            }

            .second {
                position: absolute;
                left: 300px;
                bottom: -100px;
                border: none;
                /* background-color: transparent; */
                z-index: 100;
            }
            .third {
                position: fixed;

            }

            .card{
                width: 400px;
                height: 200px;
                border: 2px solid black;
                border-radius: 10px;
            }
            .d {
                position: absolute;
                border: 2px solid red;
                top: 20px;
                left: 20px;
                z-index: 90px;
            }
            .a {
                position: absolute;
                border: 2px solid green;
                top: 10px;
                left: 10px;
                z-index: 10;

            }
            .c {
                position: absolute;
                border: 2px solid orange;
                top: 30px;
                left: 30px;
                z-index: 20px;
            }
        </style>
    </head>
    <body>
        <!-- <div class="first"></div>
        <h2>This is first</h2>
        <div class="second">This is second absolute</div>
        <h1>This is second</h1>
        <div class="third">
            <div class="inside">Inside dive</div>
        </div> -->

        <div class="card a"></div>
        <div class="d"><div class="card b"></div></div>
        <div class="card c"></div>
    </body>
</html>
