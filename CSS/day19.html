<!DOCTYPE html>
<html>
    <head>
        <title>Demo Page Day 19 | HTML Forms</title>
        <style>
            body{
                background-image: url("nature.webp");
                background-repeat: no-repeat;
                
                background-attachment: scroll;


                
            }

            .image{
                background-image: url("https://img.freepik.com/premium-photo/majestic-deer-with-impressive-antlers-resting-peacefully-lush-green-field_690082-35597.jpg");
                /* background-color: black; */
                width: full;
                height: 400px;  
                display: flex;
                background-repeat: no-repeat;
                background-size: cover;
                /* margin-left: 200px; */
                background-attachment: fixed;
                rotate: 90deg;   
            }
        </style>
    
    </head>
    <body>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
            <h1 class="head">HTML Forms</h1>
            <p class="head intro">Forms are used to collect user input.</p>
            <form action="/submit" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="1" max="100"><br><br>
                <label for="gender">Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label><br>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br><br>  
                <label for="country">Country:</label><br>
                <select id="country" name="country">
                    <option value="usa">USA</option>
                    <option value="canada">Canada</option>
                    <option value="uk">UK</option>  
                </select><br><br>
                <input type="checkbox" id="subscribe" name="subscribe" value="yes"> 
                <label for="subscribe"> Subscribe to newsletter</label><br><br>
                <input type="submit" value="Submit">
            </form>
        </div>
